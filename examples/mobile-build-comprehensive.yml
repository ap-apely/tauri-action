name: "mobile-build-comprehensive"

on:
  push:
    branches:
      - main

# Comprehensive mobile build example with proper environment setup
# This example shows how to handle both Android and iOS builds with proper configuration

jobs:
  build-mobile:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android builds - unsigned (for testing/CI)
          - platform: "ubuntu-22.04"
            mobile: "android"
            build-type: "debug"
            args: "--debug"
          - platform: "ubuntu-22.04"
            mobile: "android"
            build-type: "release-unsigned"
            args: ""
          # iOS builds - for simulator and device (requires macOS)
          - platform: "macos-latest"
            mobile: "ios"
            build-type: "debug"
            args: "--debug --target aarch64"
          - platform: "macos-latest"
            mobile: "ios"
            build-type: "simulator"
            args: "--target x86_64"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Add mobile targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim' || '' }}

      # Android setup
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # Install Android dependencies
          sudo apt-get install -y default-jdk

      - name: Setup Android SDK (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: 33.0.0
          ndk-version: 25.2.9519653

      - name: Set Android environment variables (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      # iOS setup
      - name: Setup iOS development (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          # For unsigned builds, we can disable code signing
          # This is useful for CI/CD where you don't have certificates
          echo "Setting up iOS for unsigned builds..."

      - name: install frontend dependencies
        run: npm install # change this to yarn, pnpm or bun depending on which one you use.

      # Build step with proper configuration
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For iOS unsigned builds, disable code signing
          CODE_SIGN_IDENTITY: ${{ matrix.mobile == 'ios' && '""' || '' }}
          CODE_SIGNING_REQUIRED: ${{ matrix.mobile == 'ios' && 'NO' || '' }}
        with:
          mobile: ${{ matrix.mobile }}
          includeDebug: ${{ contains(matrix.build-type, 'debug') }}
          includeRelease: ${{ !contains(matrix.build-type, 'debug') }}
          args: ${{ matrix.args }}
          # Uncomment below to create releases
          # tagName: app-v__VERSION__-${{ matrix.mobile }}-${{ matrix.build-type }}
          # releaseName: "App v__VERSION__ (${{ matrix.mobile }} ${{ matrix.build-type }})"
          # releaseBody: "Mobile build for ${{ matrix.mobile }} (${{ matrix.build-type }})"

  # Optional: Combine artifacts from different builds
  combine-artifacts:
    needs: build-mobile
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Mobile builds completed!"
          echo "Check individual job results for build artifacts."
          echo "Android APKs and iOS IPAs should be available in successful builds."